name: Release

# Push a tag like v0.1.0 (or run this by hand with a version) to build and publish a release.
# The files have fixed names, so
# https://github.com/MProductionsGmbH/diktat-app-win/releases/latest/download/Diktat-Setup.exe
# always gives the newest version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build installer and publish release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart("v") }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Diktat.slnx -c Release

      - name: Publish x64 and arm64
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-arm64") {
            dotnet publish src/Diktat.Windows/Diktat.Windows.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:Version=${{ steps.version.outputs.version }} -o "publish/$rid"
            Compress-Archive -Path "publish/$rid/*" -DestinationPath "Diktat-$rid.zip" -Force
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} /DSourceDir=..\publish\win-x64 installer\Diktat.iss
          Move-Item installer\Output\Diktat-Setup.exe Diktat-Setup.exe

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Diktat für Windows $tag" --generate-notes --target ${{ github.sha }}
          }
          gh release upload $tag Diktat-Setup.exe Diktat-win-x64.zip Diktat-win-arm64.zip --clobber
