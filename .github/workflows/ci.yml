name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Diktat.slnx

      - name: Build
        run: dotnet build Diktat.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test Diktat.slnx --configuration Release --no-build --logger GitHubActions --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish app (win-x64)
        run: dotnet publish src/Diktat.Windows/Diktat.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64

      - name: Smoke test (app starts and exits)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/win-x64/Diktat.exe -ArgumentList "--smoke-test" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Diktat-win-x64
          path: publish/win-x64

  build-crossplatform:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test platform-neutral projects
        run: |
          dotnet test tests/Diktat.Core.Tests -c Release --logger GitHubActions
          dotnet test tests/Diktat.AI.Tests -c Release --logger GitHubActions
          dotnet test tests/Diktat.Transcription.Tests -c Release --logger GitHubActions
