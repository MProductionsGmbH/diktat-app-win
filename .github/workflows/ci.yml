name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Diktat.slnx

      - name: Build
        run: dotnet build Diktat.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test Diktat.slnx --configuration Release --no-build --blame-hang-timeout 3m --logger GitHubActions --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish app (win-x64)
        run: dotnet publish src/Diktat.Windows/Diktat.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64

      - name: Smoke test (app starts and exits)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/win-x64/Diktat.exe -ArgumentList "--smoke-test" -PassThru -Wait -NoNewWindow
          $text = ""
          foreach ($log in @("publish/win-x64/smoke-test.log") + @(Get-ChildItem "$env:LOCALAPPDATA/Diktat/Logs" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object FullName)) {
            if (Test-Path $log) { $text += "== $log`n" + (Get-Content $log -Raw) + "`n" }
          }
          Write-Output $text
          if ($p.ExitCode -ne 0) {
            # Annotations are readable without signing in; logs are not.
            $escaped = $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error title=Smoke test failed (exit $($p.ExitCode))::$escaped"
            exit 1
          }

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Diktat-win-x64
          path: publish/win-x64

      # Builds the installer like the release does, installs it, starts Diktat and installs again on top.
      # The second run must replace Diktat.exe although Diktat is running (it once failed with "DeleteFile failed; code 5").
      # /NOCLOSEAPPLICATIONS leaves the Restart Manager out, so the installer's own step has to end Diktat.
      - name: Installer (update while Diktat runs)
        timeout-minutes: 15
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=0.0.0 /DSourceDir=..\publish\win-x64 installer\Diktat.iss
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Installer::ISCC failed"; exit 1 }
          $setup = (Resolve-Path installer\Output\Diktat-Setup.exe).Path
          $exe = "$env:LOCALAPPDATA\Programs\Diktat\Diktat.exe"

          function Install($log, [string[]]$extra) {
            $argList = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$log") + $extra
            $p = Start-Process $setup -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Output "::error title=Installer::$log timed out"; exit 1 }
            Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 40
            if ($p.ExitCode -ne 0) { Write-Output "::error title=Installer::$log ended with exit code $($p.ExitCode)"; exit 1 }
          }

          Install "install-first.log" @()
          if (-not (Test-Path $exe)) { Write-Output "::error title=Installer::Diktat.exe was not installed"; exit 1 }

          $app = Start-Process $exe -ArgumentList "--background" -PassThru
          Start-Sleep 15
          if ($app.HasExited) { Write-Output "::error title=Installer::Diktat did not keep running (exit $($app.ExitCode))"; exit 1 }

          Install "install-update.log" @("/NOCLOSEAPPLICATIONS")
          if (-not $app.HasExited) { $app.Kill(); Write-Output "::error title=Installer::the update did not end the running Diktat"; exit 1 }
          Write-Output "Update over a running Diktat worked."

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Diktat-Setup
          path: installer/Output/Diktat-Setup.exe

  build-crossplatform:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test platform-neutral projects
        run: |
          dotnet test tests/Diktat.Core.Tests -c Release --logger GitHubActions --blame-hang-timeout 3m
          dotnet test tests/Diktat.AI.Tests -c Release --logger GitHubActions
          dotnet test tests/Diktat.Transcription.Tests -c Release --logger GitHubActions
          dotnet test tests/Diktat.LocalModel.Tests -c Release --logger GitHubActions
